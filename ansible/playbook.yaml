#Install makefile

    - name: Installer make
      apt:
        name: make
        state: present
        update_cache: yes

#Docker 
#Copy files and .env

    - name: Copy app files
      ansible.builtin.copy:
        src: files/
        dest: /home/ubuntu/app/
        owner: ubuntu
        group: ubuntu

    - name: Generate .env
      ansible.builtin.template:
        src: templates/.env.j2
        dest: /home/ubuntu/app/inception/srcs/.env
        mode: '0666'

    - name: Launch makefile
      ansible.builtin.shell:
        cmd: make
        chdir: /home/ubuntu/app/inception
      register: result
      retries: 3
      delay: 30
      until: result.rc == 0

